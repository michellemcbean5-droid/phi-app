name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Node.js Matrix — Web (Next.js) + Mobile (Expo)
  # ────────────────────────────────────────────────────────────────────────────
  node:
    name: Node.js ${{ matrix.node-version }} — ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
        project: [web, mobile]
        include:
          - project: web
            working-directory: .
            test-command: npm run lint
            typecheck-command: npx tsc --noEmit
          - project: mobile
            working-directory: mobile
            test-command: npm run test
            typecheck-command: npx tsc --noEmit
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: ${{ matrix.typecheck-command }}
        continue-on-error: true

      - name: Run tests / lint
        run: ${{ matrix.test-command }}
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # Python Matrix — Backend (FastAPI + CrewAI)
  # ────────────────────────────────────────────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }} — Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest test_backend.py -v
        continue-on-error: true

      - name: Run backend tests (tests/ folder)
        run: pytest tests/backend/ -v
        continue-on-error: true

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # Docker Build — Backend Container
  # ────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t phi-backend:ci .
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # Summary
  # ────────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [node, python, docker]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "CI Pipeline Complete"
          echo "Node.js (web + mobile): ${{ needs.node.result }}"
          echo "Python (backend): ${{ needs.python.result }}"
          echo "Docker (backend): ${{ needs.docker.result }}"
