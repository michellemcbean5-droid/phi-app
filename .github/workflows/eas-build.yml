name: Build Android APK

on:
  push:
    branches: [claude/app-review-deployment-bkpb38, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Make expo-modules-core publishing safe against missing release component
        working-directory: mobile
        run: |
          python3 /dev/stdin << 'SCRIPT_EOF'
          path = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle'
          with open(path) as f:
              content = f.read()
          old = "  project.afterEvaluate {\n    publishing {\n      publications {\n        release(MavenPublication) {\n          from components.release\n        }\n      }\n      repositories {\n        maven {\n          url = mavenLocal().url\n        }\n      }\n    }\n  }\n}"
          new = "  project.afterEvaluate {\n    if (project.components.findByName('release') != null) {\n      publishing {\n        publications {\n          release(MavenPublication) {\n            from components.release\n          }\n        }\n        repositories {\n          maven {\n            url = mavenLocal().url\n          }\n        }\n      }\n    }\n  }\n}"
          if old not in content:
              raise SystemExit("PATTERN NOT FOUND - aborting so this does not silently no-op")
          content = content.replace(old, new)
          with open(path, 'w') as f:
              f.write(content)
          print("Patched useExpoPublishing to tolerate a missing release SoftwareComponent")
          SCRIPT_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
        env:
          EXPO_NO_DOTENV: 1

      - name: Disable unused Fresco GIF/WebP decoders (app has no GIF/WebP assets)
        working-directory: mobile/android
        run: |
          sed -i 's/expo.gif.enabled=true/expo.gif.enabled=false/' gradle.properties
          sed -i 's/expo.webp.enabled=true/expo.webp.enabled=false/' gradle.properties

      - name: Neutralize dead oss.sonatype.org snapshots repo
        working-directory: mobile/android
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/block-dead-sonatype.gradle << 'EOF'
          allprojects {
            repositories.all { repo ->
              if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')) {
                repo.content { it.excludeGroupByRegex(".*") }
              }
            }
          }
          EOF

      - name: Disable Gradle parallel project execution (works around AGP SoftwareComponent race)
        working-directory: mobile/android
        run: |
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' gradle.properties
          grep parallel gradle.properties

      # Newer AndroidX artifacts (core 1.17, activity 1.12, browser 1.9) require
      # AGP >= 8.9.1 and compileSdk >= 36. Pin both after prebuild.
      - name: Pin Android Gradle Plugin, Gradle wrapper, and compileSdk
        working-directory: mobile/android
        run: |
          python3 /dev/stdin <<'PY'
          from pathlib import Path
          import re

          build_gradle = Path('build.gradle')
          text = build_gradle.read_text()
          # Match classpath('com.android.tools.build:gradle') or with any version
          new_text, n = re.subn(
              r"""classpath\((['"])com\.android\.tools\.build:gradle(?::[^'"]+)?\1\)""",
              r"classpath(\1com.android.tools.build:gradle:8.9.1\1)",
              text,
          )
          if n == 0:
              raise SystemExit('Could not locate Android Gradle Plugin declaration in build.gradle')

          # Expo sets compileSdk via rootProject.ext / findProperty default
          new_text, c_ext = re.subn(
              r"compileSdkVersion\s*=\s*Integer\.parseInt\(findProperty\('android\.compileSdkVersion'\)\s*\?: \s*'(\d+)'\)",
              "compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')",
              new_text,
          )
          new_text, c_ext2 = re.subn(
              r"compileSdkVersion\s*=\s*\d+",
              "compileSdkVersion = 36",
              new_text,
          )
          build_gradle.write_text(new_text)
          print('--- build.gradle AGP/compileSdk ---')
          for line in build_gradle.read_text().splitlines():
              if 'com.android.tools.build:gradle' in line or 'compileSdk' in line:
                  print(line)

          app_gradle = Path('app/build.gradle')
          app_text = app_gradle.read_text()
          # Force numeric compileSdk even when it references rootProject.ext
          app_text2, c1 = re.subn(
              r'compileSdk\s+rootProject\.ext\.compileSdkVersion',
              'compileSdk 36',
              app_text,
          )
          app_text3, c2 = re.subn(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', app_text2)
          app_text4, c3 = re.subn(r'compileSdk\s+\d+', 'compileSdk 36', app_text3)
          if c1 + c2 + c3 == 0:
              raise SystemExit('Could not locate compileSdk in app/build.gradle')
          app_gradle.write_text(app_text4)
          print('--- app compileSdk lines ---')
          for line in app_gradle.read_text().splitlines():
              if 'compileSdk' in line:
                  print(line)

          # gradle.properties may also pin android.compileSdkVersion
          gp = Path('gradle.properties')
          if gp.exists():
              gp_text = gp.read_text()
              gp_text2, gpn = re.subn(
                  r'android\.compileSdkVersion\s*=\s*\d+',
                  'android.compileSdkVersion=36',
                  gp_text,
              )
              if gpn:
                  gp.write_text(gp_text2)
                  print('Updated android.compileSdkVersion in gradle.properties')

          # AGP 8.9.x requires Gradle >= 8.11.1
          # Expo escapes the URL as https\://...
          props = Path('gradle/wrapper/gradle-wrapper.properties')
          ptext = props.read_text()
          ptext2, pn = re.subn(
              r'distributionUrl=https\\?://services\.gradle\.org/distributions/gradle-[^/\s]+-all\.zip',
              r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip',
              ptext,
          )
          if pn == 0:
              ptext2, pn = re.subn(
                  r'distributionUrl=https\\?://services\.gradle\.org/distributions/gradle-[^/\s]+-bin\.zip',
                  r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip',
                  ptext,
              )
          if pn == 0:
              raise SystemExit('Could not update gradle-wrapper.properties distributionUrl')
          props.write_text(ptext2)
          print('--- gradle-wrapper.properties ---')
          print(props.read_text())
          PY

      - name: Build release APK (bundles JS, no Metro/computer needed)
        working-directory: mobile/android
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1
        env:
          # Sentry org/project are empty in app.json — skip source-map upload in CI
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phi-app-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
