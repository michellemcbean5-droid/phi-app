name: PHI Mobile — Preview Build on PR

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview.yml'

jobs:
  preview:
    name: Preview APK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run lint & type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build preview APK
        run: eas build --platform android --profile preview --non-interactive --output ${{ github.workspace }}/mobile/preview.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: phi-preview-apk
          path: mobile/preview.apk
          if-no-files-found: ignore

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `📱 **PHI Mobile Preview Build**\n\n- Build status: ${context.payload.pull_request ? 'Triggered' : 'N/A'}\n- APK artifact: [Download here](${artifactUrl})\n- Profile: \`preview\` (internal distribution APK)\n\n> ⚠️ Install this APK on your Android device for QA. iOS preview requires TestFlight or simulator build.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
